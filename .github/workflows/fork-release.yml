name: Fork Release

# Fork-only workflow, dispatched by fork-sync.yml (or by hand) for a tag that
# mirrors an upstream release. Builds the same images as upstream's
# release.yml under ghcr.io/<owner>/tracearr and publishes a GitHub release
# carrying upstream's notes. Upstream's npm, helm, mobile and reddit jobs are
# intentionally left out.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v2.5.1)'
        required: true

concurrency:
  group: fork-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tracearr
  UPSTREAM_REPO: connorgallopo/Tracearr

permissions:
  contents: read

jobs:
  check-release-type:
    name: Check Release Type
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      build-date: ${{ steps.check.outputs.build_date }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      moves-next: ${{ steps.check.outputs.moves_next }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Same rules as upstream: prereleases move :next, and a stable moves
      # :next too when it is newer than the newest upstream prerelease
      - name: Check if prerelease
        id: check
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z[-pre] tag"
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" > /dev/null || { echo "::error::Tag $TAG does not exist in this repo"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git log -1 --format=%cI "refs/tags/$TAG")" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "moves_next=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          NEWEST_BETA=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" 'v*-*' | awk '{ sub("refs/tags/", "", $2); print $2 }' | sort -V | tail -1)
          MOVES_NEXT=$(node -e '
            const [tag, beta] = process.argv.slice(1);
            const parse = (v) => { const [base, pre] = v.replace(/^v/, "").split("-"); return { n: base.split(".").map(Number), pre }; };
            const cmp = (a, b) => { for (let i = 0; i < 3; i++) { if (a.n[i] !== b.n[i]) return a.n[i] - b.n[i]; } if (!a.pre && b.pre) return 1; if (a.pre && !b.pre) return -1; return 0; };
            console.log(!beta || cmp(parse(tag), parse(beta)) > 0 ? "true" : "false");
          ' "$TAG" "$NEWEST_BETA")
          echo "moves_next=$MOVES_NEXT" >> "$GITHUB_OUTPUT"
          echo "Stable release $TAG (newest upstream beta ${NEWEST_BETA:-none}, moves next: $MOVES_NEXT)"

  # Standard and supervised images, each built natively per platform
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [check-release-type]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [docker, supervised]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - variant: docker
            dockerfile: ./docker/Dockerfile
            tag-prefix: ''
          - variant: supervised
            dockerfile: ./docker/Dockerfile.supervised
            tag-prefix: 'supervised-'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.check-release-type.outputs.tag }}

      # MAXMIND_LICENSE_KEY is optional: without it the databases committed
      # upstream are used as-is
      - name: Update GeoIP database
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          if [ -z "$MAXMIND_LICENSE_KEY" ]; then
            echo "No MAXMIND_LICENSE_KEY, using committed GeoLite2 databases"
            exit 0
          fi
          for edition in City ASN; do
            curl -sSL "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-${edition}&license_key=${MAXMIND_LICENSE_KEY}&suffix=tar.gz" \
              -o "/tmp/geolite2-${edition}.tar.gz" && \
            tar -xzf "/tmp/geolite2-${edition}.tar.gz" -C /tmp && \
            mv /tmp/GeoLite2-${edition}_*/GeoLite2-${edition}.mmdb "data/GeoLite2-${edition}.mmdb" && \
            echo "Updated GeoLite2-${edition}.mmdb" || \
            echo "GeoLite2-${edition} download failed, using existing database"
          done

      - name: Fetch basemap
        uses: ./.github/actions/fetch-basemap

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=fork-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.variant }}-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ needs.check-release-type.outputs.tag }}
            APP_TAG=${{ matrix.tag-prefix }}${{ needs.check-release-type.outputs.tag }}
            APP_COMMIT=${{ needs.check-release-type.outputs.sha }}
            APP_BUILD_DATE=${{ needs.check-release-type.outputs.build-date }}
            CACHE_BUST=${{ needs.check-release-type.outputs.sha }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Multi-arch manifests with upstream's tag scheme:
  #   docker:     X.Y.Z[-pre], X.Y, X, latest, next
  #   supervised: supervised-X.Y.Z[-pre], supervised, supervised-next
  merge:
    name: Merge ${{ matrix.variant }} manifest
    runs-on: ubuntu-latest
    needs: [check-release-type, build]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: docker
            flavor: |
              latest=false
            tags: |
              type=semver,pattern={{version}},value=${{ needs.check-release-type.outputs.tag }}
              type=semver,pattern={{major}}.{{minor}},value=${{ needs.check-release-type.outputs.tag }},enable=${{ needs.check-release-type.outputs.prerelease == 'false' }}
              type=semver,pattern={{major}},value=${{ needs.check-release-type.outputs.tag }},enable=${{ needs.check-release-type.outputs.prerelease == 'false' }}
              type=raw,value=latest,enable=${{ needs.check-release-type.outputs.prerelease == 'false' }}
              type=raw,value=next,enable=${{ needs.check-release-type.outputs.moves-next == 'true' }}
          - variant: supervised
            flavor: |
              prefix=supervised-,onlatest=false
              latest=false
            tags: |
              type=semver,pattern={{version}},value=${{ needs.check-release-type.outputs.tag }}
              type=raw,value=supervised,enable=${{ needs.check-release-type.outputs.prerelease == 'false' }},prefix=
              type=raw,value=supervised-next,enable=${{ needs.check-release-type.outputs.moves-next == 'true' }},prefix=

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: ${{ matrix.flavor }}
          tags: ${{ matrix.tags }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          if [ -z "$(ls -A .)" ]; then
            echo "Error: No digests found!"
            exit 1
          fi
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-release-type, merge]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.check-release-type.outputs.tag }}
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-release-type.outputs.tag }}
          PRERELEASE: ${{ needs.check-release-type.outputs.prerelease }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          UPSTREAM_TAG_SHA=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/tags/$TAG^{}" "refs/tags/$TAG" | sort -k2 | tail -1 | cut -f1)
          {
            echo "Fork build of [upstream $TAG](https://github.com/${UPSTREAM_REPO}/releases/tag/$TAG) with this fork's patches applied."
            echo
            echo 'Images: `'"$IMAGE:${TAG#v}"'`, `'"$IMAGE:supervised-${TAG#v}"'`'
            echo
            echo "### Fork patches"
            if [ -n "$UPSTREAM_TAG_SHA" ] && git cat-file -e "$UPSTREAM_TAG_SHA" 2>/dev/null; then
              git log --no-merges --reverse --format='- %s (%h)' "$UPSTREAM_TAG_SHA..HEAD"
            else
              echo "_Could not resolve the upstream tag commit._"
            fi
            echo
            echo "---"
            echo
            gh release view "$TAG" -R "$UPSTREAM_REPO" --json body -q .body
          } > release_notes.md

          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release_notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release_notes.md "${FLAGS[@]}"
          fi
