name: GeoIP Refresh

# MaxMind's GeoLite EULA requires replacing a database within 30 days of a newer
# release. Runs daily and opens a refresh PR once the committed databases are old
# enough; manual runs open one regardless of age.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: geoip-refresh
  cancel-in-progress: false

env:
  # Opening the PR at 25 days leaves five to merge it inside the 30
  REFRESH_AFTER_DAYS: 25
  BRANCH: geoip-refresh

jobs:
  refresh:
    name: Refresh GeoLite2 databases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check database age
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "a refresh PR is already open"
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&path=data/GeoLite2-City.mmdb&per_page=1" --jq '.[0].commit.committer.date')
          DAYS=$(( ($(date +%s) - $(date -d "$LAST" +%s)) / 86400 ))
          echo "committed databases last updated $LAST ($DAYS days ago)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$DAYS" -ge "$REFRESH_AFTER_DAYS" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.due.outputs.due == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Update GeoIP database
        if: steps.due.outputs.due == 'true'
        uses: ./.github/actions/fetch-geoip
        with:
          license-key: ${{ secrets.MAXMIND_LICENSE_KEY }}

      - name: Open refresh PR
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/GeoLite2-City.mmdb data/GeoLite2-ASN.mmdb; then
            echo "databases unchanged since the last commit, nothing to open"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/GeoLite2-City.mmdb data/GeoLite2-ASN.mmdb
          git commit -m "update geolite2 databases"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "update geolite2 databases" \
            --body "Refreshes the committed GeoLite2 City and ASN databases. MaxMind's GeoLite EULA requires replacing them within 30 days of a newer release."
